[package]
name = "cubilot"
version = "0.12.0"
edition = "2021"

[lib]
name = "cubilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools feature exposes "Inspect Element" in the webview + keyboard shortcut
# Cmd+Opt+I. Shipped in release builds as well so end-user bug reports can
# include console logs without requiring a dev build.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
dirs = "5"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "io-util", "fs"] }
portable-pty = "0.8"
base64 = "0.22"
libc = "0.2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
